# Local database for the ShopIT demo. The backend works against this instance
# or against the existing Neon setup – only DATABASE_URL in .env changes.
services:
  db:
    image: postgres:16
    container_name: shopit-db
    environment:
      POSTGRES_DB: shopit
      POSTGRES_USER: shopit
      POSTGRES_PASSWORD: shopit
    ports:
      - "5432:5432"
    volumes:
      - shopit_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shopit -d shopit"]
      interval: 2s
      timeout: 3s
      retries: 10

volumes:
  shopit_db:
