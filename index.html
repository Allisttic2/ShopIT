<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NTI-T Shopp</title>
  <script src="api.js?v=filters"></script>
  <script src="auth.js"></script>
  <!-- Font Awesome Ikoner -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="main.css">
  <style>
    :root {
      --bg-glass: rgba(9, 14, 23, 0.88);
      --header-bg: var(--bg-glass);
      --shadow-elevated: 0 10px 30px -10px rgba(0, 0, 0, 0.5);
    }

    /* --- CONTAINER & VARVADE SEKTIONER --- */
    .container {
      max-width: 100%;
      margin: 0 auto;
      padding: 0;
    }

    .section-wrapper {
      padding: 3.5rem 1.5rem;
      border-bottom: 1px solid var(--border-color);
      background-color: var(--bg-main);
    }

    .section-inner {
      max-width: 1200px;
      margin: 0 auto;
    }

    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.5rem;
    }

    .section-title {
      font-size: 1.2rem;
      font-weight: 600;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 0.5rem;
      letter-spacing: -0.2px;
    }

    .section-title i {
      color: var(--text-main);
      font-size: 1rem;
    }

    /* --- FÄRGKODAD SKICK-PILL --- */
    .condition-pill {
      font-size: 0.72rem;
      font-weight: 700;
      padding: 0.2rem 0.55rem;
      border-radius: 4px;
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      letter-spacing: 0.2px;
    }

    /* --- LAGER-PILL --- */
    .stock-badge {
      position: absolute;
      top: 10px;
      left: 10px;
      background: rgba(9, 14, 23, 0.88);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 0.2rem 0.6rem;
      border-radius: 4px;
      font-size: 0.72rem;
      font-weight: 600;
      backdrop-filter: blur(4px);
      z-index: 2;
      display: flex;
      align-items: center;
      gap: 0.35rem;
    }

    .stock-badge i {
      color: var(--text-muted);
      font-size: 0.7rem;
    }

    /* --- SENASTE ANNONSER --- */
    .latest-section {
      transition: all 0.3s ease;
    }

    .latest-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 1.25rem;
    }

    .latest-grid .stock-badge,
    .latest-grid .fav-btn,
    .latest-grid .product-location {
      display: none;
    }

    .latest-grid .product-img-wrap { height: 150px; }

    .latest-grid .product-info {
      padding: 1rem;
      justify-content: space-between;
      gap: 0.8rem;
      border-top: 1px solid var(--border-color);
    }

    .latest-grid .product-meta { justify-content: flex-start; margin-bottom: 0; }

    .latest-grid .product-title {
      margin-bottom: 0;
      font-size: 0.9rem;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .latest-grid .product-footer { margin-top: 0; padding-top: 0; border-top: 0; }
    .latest-grid .product-price { font-size: 1rem; }
    .latest-grid .btn-add-cart { width: 32px; height: 32px; padding: 0; justify-content: center; font-size: 0.85rem; }
    .latest-grid .btn-add-cart span { display: none; }

    .latest-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      overflow: hidden;
      transition: border-color 0.2s ease, transform 0.2s ease;
      display: flex;
      flex-direction: column;
      cursor: pointer;
      position: relative;
    }

    .latest-card:hover {
      border-color: var(--border-hover);
      transform: translateY(-2px);
    }

    .latest-card-img-wrap {
      width: 100%;
      height: 150px;
      overflow: hidden;
      background: rgba(0, 0, 0, 0.2);
    }

    .latest-card-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0.9;
      transition: opacity 0.2s ease;
    }

    .latest-card:hover .latest-card-img {
      opacity: 1;
    }

    .latest-card-body {
      padding: 1rem;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
      justify-content: space-between;
      border-top: 1px solid var(--border-color);
      gap: 0.8rem;
    }

    .latest-card-title {
      font-weight: 500;
      font-size: 0.9rem;
      color: var(--text-main);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .card-action-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .latest-card-price {
      font-size: 1rem;
      font-weight: 700;
      color: var(--text-main);
    }

    .btn-cart-icon {
      background: transparent;
      color: var(--text-muted);
      border: 1px solid var(--border-color);
      width: 32px;
      height: 32px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s ease;
      font-size: 0.85rem;
    }

    .btn-cart-icon:hover {
      border-color: var(--border-hover);
      color: var(--text-main);
    }

    .marketplace-search {
      padding: 1.5rem 1.5rem 0;
    }

    .search-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 15rem) auto;
      gap: 0.75rem;
    }

    .search-row input,
    .county-search,
    .search-row button,
    .filter-actions button {
      min-width: 0;
      border: 1px solid var(--border-color);
      border-radius: 7px;
      padding: 0.65rem 1rem;
      background: var(--bg-card);
      color: var(--text-main);
    }

    .search-row input::placeholder,
    .county-search::placeholder {
      color: var(--text-muted);
    }

    .search-row button,
    .filter-actions button {
      cursor: pointer;
    }

    .search-row .search-submit,
    .filter-actions .search-submit {
      background: var(--accent-main);
      color: var(--accent-text);
      font-weight: 700;
    }

    .search-row .search-submit:hover,
    .filter-actions .search-submit:hover {
      background: var(--accent-hover);
    }

    .filter-toggle {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
      text-align: left;
    }

    .filter-toggle:hover,
    .filter-toggle[aria-expanded="true"] {
      border-color: #60a5fa;
    }

    .filter-toggle[aria-expanded="true"] i {
      transform: rotate(180deg);
    }

    .filter-panel {
      margin-top: 1rem;
      padding: 1rem;
      border: 1px solid #315479;
      border-radius: 8px;
      background: var(--bg-alt);
    }

    .filter-groups {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr)) minmax(0, 1.35fr);
      gap: 1rem;
    }

    .filter-groups fieldset {
      min-width: 0;
      border: 0;
    }

    .filter-groups legend {
      margin-bottom: 0.55rem;
      font-weight: 700;
    }

    .filter-groups label {
      display: flex;
      align-items: baseline;
      gap: 0.5rem;
      margin-block: 0.25rem;
      font-size: 0.9rem;
      cursor: pointer;
    }

    .filter-groups input:is([type="checkbox"], [type="radio"]) {
      flex: none;
      accent-color: #60a5fa;
    }

    .county-search {
      width: 100%;
      padding: 0.35rem 0.65rem;
    }

    .county-options {
      max-height: 8rem;
      overflow-y: auto;
      margin-top: 0.5rem;
      padding: 0.25rem 0.65rem;
      border: 1px solid var(--border-color);
      border-radius: 6px;
    }

    .county-options label[hidden] {
      display: none;
    }

    .county-count {
      color: var(--text-muted);
      font-size: 0.8rem;
    }

    .filter-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.5rem;
      margin-top: 1rem;
      padding-top: 0.75rem;
      border-top: 1px solid var(--border-color);
    }

    .filter-actions .filter-reset {
      background: transparent;
      border-color: transparent;
      color: #93c5fd;
      text-decoration: underline;
    }

    /* --- PRODUKTFLÖDE --- */
    .feed-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 1.25rem;
    }

    .product-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      overflow: hidden;
      transition: border-color 0.2s ease, transform 0.2s ease;
      display: flex;
      flex-direction: column;
      position: relative;
      cursor: pointer;
    }

    .product-card:hover {
      border-color: var(--border-hover);
      transform: translateY(-2px);
    }

    .fav-btn {
      position: absolute;
      top: 10px;
      right: 10px;
      background: rgba(9, 14, 23, 0.85);
      border: 1px solid var(--border-color);
      width: 32px;
      height: 32px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: var(--text-muted);
      transition: all 0.2s ease;
      z-index: 2;
      font-size: 0.85rem;
    }

    .fav-btn:hover, .fav-btn.active {
      color: #f87171;
      border-color: #f87171;
    }

    .product-img-wrap {
      width: 100%;
      height: 170px;
      overflow: hidden;
      background: rgba(0, 0, 0, 0.2);
    }

    .product-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0.9;
      transition: opacity 0.2s ease;
    }

    .product-card:hover .product-img {
      opacity: 1;
    }

    .product-info {
      padding: 1.1rem;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
    }

    .product-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.75rem;
      color: #64748b;
      margin-bottom: 0.4rem;
    }

    .product-title {
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--text-main);
      margin-bottom: 0.75rem;
      line-height: 1.35;
    }

    .product-footer {
      margin-top: auto;
      padding-top: 0.75rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-top: 1px solid var(--border-color);
    }

    .product-price {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--text-main);
    }

    .btn-add-cart {
      background: transparent;
      color: var(--text-main);
      border: 1px solid var(--border-color);
      padding: 0.45rem 0.8rem;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .btn-add-cart:hover {
      border-color: var(--border-hover);
      color: var(--text-main);
      background: rgba(248, 246, 240, 0.05);
    }

    /* --- DEDIKERAD PRODUKTSIDA (FULL VIEW) --- */
    .product-page-wrapper {
      max-width: 1200px;
      margin: 0 auto;
      padding: 3rem 1.5rem 5rem;
      min-height: 70vh;
    }

    .btn-back {
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      background: transparent;
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      padding: 0.6rem 1.2rem;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 500;
      cursor: pointer;
      margin-bottom: 2.5rem;
      transition: all 0.2s ease;
    }

    .btn-back:hover {
      border-color: var(--border-hover);
      color: var(--text-main);
      background: rgba(248, 246, 240, 0.03);
    }

    .product-page-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 2.5rem;
      box-shadow: var(--shadow-elevated);
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 3rem;
    }

    @media (max-width: 868px) {
      .product-page-card {
        grid-template-columns: 1fr;
        padding: 1.5rem;
        gap: 2rem;
      }
    }

    .product-page-img-wrap {
      width: 100%;
      height: 380px;
      border-radius: 12px;
      overflow: hidden;
      background: var(--bg-main);
      border: 1px solid var(--border-color);
    }

    .product-page-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .product-page-info {
      display: flex;
      flex-direction: column;
    }

    .product-page-title {
      font-size: 1.8rem;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 0.5rem;
      line-height: 1.25;
    }

    .product-page-price {
      font-size: 1.8rem;
      font-weight: 800;
      color: var(--text-main);
      margin-bottom: 1.5rem;
    }

    .product-page-spec-list {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      padding: 1.25rem 0;
      border-top: 1px solid var(--border-color);
      border-bottom: 1px solid var(--border-color);
      margin-bottom: 1.5rem;
      font-size: 0.9rem;
    }

    .spec-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: var(--text-muted);
    }

    .spec-item strong {
      color: var(--text-main);
    }

    .product-page-desc {
      color: var(--text-muted);
      font-size: 0.95rem;
      line-height: 1.65;
      margin-bottom: 2rem;
      flex-grow: 1;
    }

    .product-page-actions {
      display: flex;
      gap: 1rem;
      margin-top: auto;
    }

    .btn-page-buy {
      flex: 1;
      background: var(--accent-main);
      color: var(--accent-text);
      border: none;
      padding: 0.9rem 1.5rem;
      border-radius: 8px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
      transition: background 0.2s ease;
      font-size: 0.95rem;
    }

    .btn-page-buy:hover {
      background: var(--accent-hover);
    }

    .btn-page-buy-direct {
      background: transparent;
      border: 1px solid var(--border-color);
      color: var(--text-main);
    }

    .btn-page-buy-direct:hover {
      background: rgba(248, 246, 240, 0.05);
      border-color: var(--border-hover);
    }

    /* --- VARUKORG SIDEBAR (DRAWER) --- */
    .cart-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(4px);
      z-index: 200;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }

    .cart-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .cart-drawer {
      position: fixed;
      top: 0;
      right: -420px;
      width: 100%;
      max-width: 380px;
      height: 100%;
      background: var(--bg-card);
      border-left: 1px solid var(--border-color);
      box-shadow: -10px 0 30px rgba(0,0,0,0.5);
      z-index: 201;
      transition: right 0.25s ease;
      display: flex;
      flex-direction: column;
    }

    .cart-overlay.active .cart-drawer {
      right: 0;
    }

    .cart-header {
      padding: 1.25rem 1.5rem;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--bg-main);
    }

    .cart-header h3 {
      font-size: 1rem;
      font-weight: 600;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .close-cart-btn {
      background: transparent;
      border: none;
      font-size: 1.1rem;
      color: var(--text-muted);
      cursor: pointer;
    }

    .close-cart-btn:hover {
      color: var(--text-main);
    }

    .cart-body {
      flex: 1;
      overflow-y: auto;
      padding: 1.25rem 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .cart-empty-msg {
      text-align: center;
      color: var(--text-muted);
      margin-top: 3rem;
      font-size: 0.9rem;
    }

    .cart-item {
      display: flex;
      align-items: center;
      gap: 0.8rem;
      padding-bottom: 0.8rem;
      border-bottom: 1px solid var(--border-color);
    }

    .cart-item-img {
      width: 54px;
      height: 54px;
      border-radius: 6px;
      object-fit: cover;
      background: var(--bg-main);
    }

    .cart-item-details {
      flex: 1;
    }

    .cart-item-title {
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--text-main);
      margin-bottom: 0.2rem;
    }

    .cart-item-price {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--text-main);
    }

    .cart-qty-controls {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      margin-top: 0.4rem;
    }

    .qty-btn {
      background: transparent;
      border: 1px solid var(--border-color);
      color: var(--text-main);
      width: 22px;
      height: 22px;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 0.8rem;
      line-height: 1;
      transition: all 0.2s ease;
    }

    .qty-btn:hover {
      border-color: var(--border-hover);
      color: var(--text-main);
    }

    .qty-val {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-main);
      min-width: 18px;
      text-align: center;
    }

    .cart-item-remove {
      background: transparent;
      border: none;
      color: #64748b;
      cursor: pointer;
      font-size: 0.85rem;
      transition: color 0.2s ease;
      padding: 0.3rem;
    }

    .cart-item-remove:hover {
      color: #f87171;
    }

    .cart-footer {
      padding: 1.25rem 1.5rem;
      border-top: 1px solid var(--border-color);
      background: var(--bg-main);
    }

    .cart-total-row {
      display: flex;
      justify-content: space-between;
      font-size: 1rem;
      font-weight: 600;
      color: var(--text-main);
      margin-bottom: 1rem;
    }

    .checkout-btn {
      width: 100%;
      background: var(--accent-main);
      color: var(--accent-text);
      border: none;
      padding: 0.75rem;
      border-radius: 6px;
      font-weight: 700;
      font-size: 0.9rem;
      cursor: pointer;
      transition: background 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
    }

    .checkout-btn:hover {
      background: var(--accent-hover);
    }

    @media (max-width: 900px) {
      .filter-groups { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    }

    @media (max-width: 600px) {
      .marketplace-search { padding-inline: 1rem; }
      .search-row { grid-template-columns: minmax(0, 1fr) auto; gap: 0.5rem; }
      .search-row input { grid-column: 1 / -1; }
      .filter-groups { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .county-group { grid-column: 1 / -1; }
    }
  </style>
</head>
<body>

  <!-- HEADER / NAVBAR -->
  <header>
    <div class="header-container">
      <a onclick="showHomeView(true)" class="logo">
        <img src="images/logo.png" alt="NTI-T Shopp Logo" class="logo-img">
        <span>NTI-T SHOPP</span>
      </a>
      
      <!-- Navigationslänkar utan ikoner och med hover-border -->
      <nav class="nav-links">
        <a href="#products.html" class="nav-link">Produkter</a>
        <a href="profil.html" class="nav-link">Profil</a>
        <a href="help.html" class="nav-link">Hjälp</a>
      </nav>

      <!-- Högersektion -->
      <div class="header-actions">
        <button class="cart-btn" id="openCartBtn" title="Varukorg">
          <i class="fa-solid fa-cart-shopping"></i>
          <span class="cart-badge" id="cartBadge">0</span>
        </button>

        <a href="profil.html" class="settings-btn" title="Inställningar">
          <i class="fa-solid fa-gear"></i>
        </a>
      </div>
    </div>
  </header>

  <!-- VYN 1: STARTSIDA (HOME VIEW) -->
  <div id="homeView">
    <!-- HUVUDINNEHÅLL -->
    <main class="container">
      <div class="marketplace-search">
        <form class="section-inner" id="listingSearch" role="search" aria-label="Sök bland annonser">
          <div class="search-row">
            <input type="search" id="searchInput" aria-label="Sök annonser" placeholder="Sök hårdvara, modell eller specifikation…">
            <button type="button" class="filter-toggle" id="filterToggle" aria-expanded="false" aria-controls="filterPanel">
              <span id="filterToggleLabel">Alla kategorier</span><i class="fa-solid fa-chevron-down" aria-hidden="true"></i>
            </button>
            <button type="submit" class="search-submit">Sök</button>
          </div>
          <div class="filter-panel" id="filterPanel" hidden>
            <div class="filter-groups">
              <fieldset>
                <legend>Kategori</legend>
                <label><input type="checkbox" name="category" value="Datorer"> Datorer</label>
                <label><input type="checkbox" name="category" value="Laddare"> Laddare</label>
                <label><input type="checkbox" name="category" value="Kablar"> Kablar</label>
                <label><input type="checkbox" name="category" value="Skärmar"> Skärmar</label>
                <label><input type="checkbox" name="category" value="Switchar"> Switchar</label>
                <label><input type="checkbox" name="category" value="Router"> Router</label>
              </fieldset>
              <fieldset>
                <legend>Pris</legend>
                <label><input type="checkbox" name="price" value="low"> Under 2 000 kr</label>
                <label><input type="checkbox" name="price" value="mid"> 2 000–10 000 kr</label>
                <label><input type="checkbox" name="price" value="high"> Över 10 000 kr</label>
              </fieldset>
              <fieldset>
                <legend>Skick</legend>
                <label><input type="checkbox" name="condition" value="good"> Bra skick (7–10)</label>
                <label><input type="checkbox" name="condition" value="used"> Bruksskick (4–6)</label>
                <label><input type="checkbox" name="condition" value="worn"> Slitet skick (1–3)</label>
                <label><input type="checkbox" name="condition" value="unknown"> Ej angivet</label>
              </fieldset>
              <fieldset>
                <legend>Sortera</legend>
                <label><input type="radio" name="sort" value="newest" checked> Nyast först</label>
                <label><input type="radio" name="sort" value="price-asc"> Lägsta pris</label>
                <label><input type="radio" name="sort" value="price-desc"> Högsta pris</label>
              </fieldset>
              <fieldset class="county-group">
                <legend>Plats</legend>
                <input type="search" class="county-search" id="countySearch" aria-label="Sök län" placeholder="Sök län">
                <div class="county-options" id="countyOptions"></div>
                <p class="county-count" id="countyCount" role="status"></p>
              </fieldset>
            </div>
            <div class="filter-actions">
              <button type="button" class="filter-reset" id="resetFilters">Rensa filter</button>
              <button type="submit" class="search-submit">Visa resultat</button>
            </div>
          </div>
        </form>
      </div>

      <!-- SEKTION 1: SENASTE ANNONSER -->
      <div class="section-wrapper" id="latestSectionWrapper">
        <div class="section-inner">
          <section class="latest-section" id="latestSection">
            <div class="section-header">
              <h2 class="section-title"><i class="fa-solid fa-clock-rotate-left"></i> Senast inkommet</h2>
            </div>
            <div class="latest-grid" id="latestGrid">
              <!-- Genereras dynamiskt via JS -->
            </div>
          </section>
        </div>
      </div>

      <!-- SEKTION 2: PRODUKTFLÖDE -->
      <div class="section-wrapper" id="productSectionWrapper">
        <div class="section-inner">
          <section id="productSection">
            <div class="section-header">
              <h2 class="section-title"><i class="fa-solid fa-server"></i> Utforska hårdvara</h2>
            </div>
            <div class="feed-grid" id="productFeed">
              <!-- Genereras dynamiskt via JS -->
            </div>
          </section>
        </div>
      </div>
    </main>
  </div>

  <!-- VYN 2: DEDIKERAD PRODUKTSIDA (PRODUCT PAGE VIEW) -->
  <div id="productPageView" style="display: none;">
    <div class="product-page-wrapper">
      <button class="btn-back" onclick="showHomeView(true)">
        <i class="fa-solid fa-arrow-left"></i> Tillbaka till alla produkter
      </button>

      <div class="product-page-card" id="productPageContent">
        <!-- Genereras dynamiskt när användaren klickar på en produkt -->
      </div>
    </div>
  </div>

  <!-- VARUKORG SIDEBAR / MODAL -->
  <div class="cart-overlay" id="cartOverlay">
    <div class="cart-drawer">
      <div class="cart-header">
        <h3><i class="fa-solid fa-cart-shopping"></i> Din varukorg</h3>
        <button class="close-cart-btn" id="closeCartBtn"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div class="cart-body" id="cartBody">
        <!-- Produkterna hamnar här -->
      </div>
      <div class="cart-footer">
        <div class="cart-total-row">
          <span>Totalt:</span>
          <span id="cartTotal">0 kr</span>
        </div>
        <button class="checkout-btn" onclick="goToCheckout()" id="checkoutBtn" disabled>
          Gå till kassan <i class="fa-solid fa-arrow-right"></i>
        </button>
      </div>
    </div>
  </div>

  <!-- FOOTER -->
  <footer class="shop-footer">
    <p class="footer-bottom">&copy; 2026 NTI-T Shopp AB. Alla rättigheter förbehållna.</p>
  </footer>

  <script>
    const { counties, normalizePlace, countyForListing } = NTIT;
    // DATA LAGER: annonserna hämtas från backend-API:et (GET /api/listings)
    let listings = [];

    // VARUKORG TILLSTÅND (lokal; rader pekar på listings via uuid)
    const CART_KEY = 'ntit_cart';
    let cart = NTIT.readCart();

    // ELEMENT REFERENSER
    const feedContainer = document.getElementById('productFeed');
    const latestGrid = document.getElementById('latestGrid');
    const latestSectionWrapper = document.getElementById('latestSectionWrapper');
    const listingSearch = document.getElementById('listingSearch');
    const searchInput = document.getElementById('searchInput');
    const filterToggle = document.getElementById('filterToggle');
    const filterPanel = document.getElementById('filterPanel');
    const countySearch = document.getElementById('countySearch');
    const countyOptions = document.getElementById('countyOptions');
    const countyCount = document.getElementById('countyCount');
    let activeFilters = new FormData(listingSearch);
    const cartOverlay = document.getElementById('cartOverlay');
    const openCartBtn = document.getElementById('openCartBtn');
    const closeCartBtn = document.getElementById('closeCartBtn');
    const cartBody = document.getElementById('cartBody');
    const cartTotal = document.getElementById('cartTotal');
    const cartBadge = document.getElementById('cartBadge');

    const homeView = document.getElementById('homeView');
    const productPageView = document.getElementById('productPageView');
    const productPageContent = document.getElementById('productPageContent');

    // NEUTRAL KATEGORIPILL
    function categoryPill(category) {
      return `<span class="condition-pill" style="background:rgba(96,165,250,0.12); color:#60a5fa; border:1px solid rgba(96,165,250,0.3);">
                <i class="fa-solid fa-tag"></i> ${NTIT.escapeHTML(category || 'Övrigt')}
              </span>`;
    }

    // Annonsens publiceringsdatum samt dagar kvar till 30-dagarstiden går ut
    function formatPublishedAt(value) {
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return 'Ej känd';
      return new Intl.DateTimeFormat('sv-SE', { dateStyle: 'medium', timeStyle: 'short' }).format(date);
    }

    function expiryLabel(value) {
      const timestamp = new Date(value).getTime();
      if (Number.isNaN(timestamp)) return 'Ej känd';
      const days = Math.ceil((timestamp - Date.now()) / 86400000);
      if (days <= 0) return 'inom dygnet';
      if (days === 1) return 'om 1 dag';
      return `om ${days} dagar`;
    }

    function createListingCard(listing) {
      const card = document.createElement('div');
      card.className = 'product-card';
      card.onclick = () => openProductPage(listing.id);
      card.innerHTML = `
        <div class="stock-badge"><i class="fa-solid fa-boxes-stacked"></i> ${listing.quantity} i lager</div>
        <button class="fav-btn" title="Spara som favorit">
          <i class="fa-regular fa-heart"></i>
        </button>
        <div class="product-img-wrap"><img src="${NTIT.escapeHTML(listing.image_url || 'images/product-placeholder.svg')}" alt="${NTIT.escapeHTML(listing.title)}" class="product-img" loading="lazy"></div>
        <div class="product-info">
          <div class="product-meta">
            <span class="product-location"><i class="fa-solid fa-location-dot"></i> ${NTIT.escapeHTML(listing.city || 'Anges senare')}</span>
            ${categoryPill(listing.category)}
          </div>
          <div class="product-title">${NTIT.escapeHTML(listing.title)}</div>
          <div class="product-footer">
            <div class="product-price">${NTIT.money(listing.price)}</div>
            <button class="btn-add-cart" title="Lägg i varukorg">
              <i class="fa-solid fa-cart-plus"></i><span> Köp</span>
            </button>
          </div>
        </div>
      `;
      card.querySelector('.fav-btn').addEventListener('click', event => {
        event.stopPropagation();
        toggleFav(event.currentTarget);
      });
      card.querySelector('.btn-add-cart').addEventListener('click', event => {
        event.stopPropagation();
        addToCart(listing.id);
      });
      return card;
    }

    function renderLatest() {
      latestGrid.innerHTML = '';
      listings.slice(0, 4).forEach(listing => {
        latestGrid.appendChild(createListingCard(listing));
      });
    }

    function renderProducts(listingList) {
      feedContainer.innerHTML = '';
      if(listingList.length === 0) {
        feedContainer.innerHTML = '<p style="grid-column: 1/-1; text-align: center; color: var(--text-muted); padding: 3rem;">Inga produkter matchar dina sökkriterier.</p>';
        return;
      }
      listingList.forEach(listing => feedContainer.appendChild(createListingCard(listing)));
    }

    // VY-NAVIGERING: ÖPPNA PRODUKTSIDA (HELTÄCKANDE VY)
    function openProductPage(id) {
      const listing = listings.find(l => l.id === id);
      if (!listing) return;

      productPageContent.innerHTML = `
        <div class="product-page-img-wrap"><img src="${NTIT.escapeHTML(listing.image_url || 'images/product-placeholder.svg')}" alt="${NTIT.escapeHTML(listing.title)}" class="product-page-img"></div>
        <div class="product-page-info">
          <div class="product-page-title">${NTIT.escapeHTML(listing.title)}</div>
          <div class="product-page-price">${NTIT.money(listing.price)}</div>

          <div class="product-page-spec-list">
            <div class="spec-item">
              <span>Lagerstatus:</span>
              <strong style="color:var(--text-main);"><i class="fa-solid fa-boxes-stacked"></i> ${listing.quantity} st tillgängliga</strong>
            </div>
            <div class="spec-item">
              <span>Kategori:</span>
              ${categoryPill(listing.category)}
            </div>
            <div class="spec-item">
              <span>Skick:</span>
              <strong>${listing.condition_score == null ? 'Ej angivet' : `${Number(listing.condition_score)}/10`}</strong>
            </div>
            <div class="spec-item">
              <span>Plats / Ort:</span>
              <strong><i class="fa-solid fa-location-dot"></i> ${NTIT.escapeHTML(listing.city || 'Anges senare')}</strong>
            </div>
            <div class="spec-item">
              <span>Säljare:</span>
              <strong><i class="fa-solid fa-graduation-cap"></i> ${NTIT.escapeHTML(listing.school_name || 'Okänd skola')}</strong>
            </div>
            <div class="spec-item">
              <span>Publicerad:</span>
              <strong><i class="fa-solid fa-calendar-days"></i> ${NTIT.escapeHTML(formatPublishedAt(listing.created_at))}</strong>
            </div>
            <div class="spec-item">
              <span>Går ut:</span>
              <strong><i class="fa-solid fa-hourglass-half"></i> ${NTIT.escapeHTML(expiryLabel(listing.expires_at))}</strong>
            </div>
          </div>

          <div class="product-page-desc">
            <h4 style="color:var(--text-main); margin-bottom: 0.5rem; font-weight:600;">Produktbeskrivning</h4>
            ${NTIT.escapeHTML(listing.description || 'Ingen ytterligare beskrivning angiven.').replace(/\n/g, '<br>')}
          </div>

          <div class="product-page-actions">
            <button class="btn-page-buy" onclick="addToCart('${listing.id}')">
              <i class="fa-solid fa-cart-plus"></i> Lägg i varukorg
            </button>
            <button class="btn-page-buy btn-page-buy-direct" onclick="buyDirect('${listing.id}')">
              <i class="fa-solid fa-bolt"></i> Köp direkt
            </button>
          </div>
        </div>
      `;

      homeView.style.display = 'none';
      productPageView.style.display = 'block';
      window.scrollTo(0, 0);
    }

    // VISA STARTSIDAN IGEN
    function showHomeView(scrollToTop = false) {
      if (productPageView.style.display !== 'none') {
        productPageView.style.display = 'none';
        homeView.style.display = 'block';
      }
      if (scrollToTop) {
        window.scrollTo(0, 0);
      }
    }

    // KÖPÅTGÄRDER KRÄVER INLOGGNAD SESSION (annars till inloggning)
    function requireSession() {
      if (NTIT.getSession()) return true;
      location.replace('login.html?next=index.html');
      return false;
    }

    // VARUKORG LOGIK
    function addToCart(id) {
      if (!requireSession()) return;
      const listing = listings.find(l => l.id === id);
      if (!listing || listing.quantity <= 0) return;

      const existing = cart.find(item => item.id === id);
      if(existing) {
        if (existing.qty < (existing.max || listing.quantity)) existing.qty += 1;
      } else {
        cart.push({
          id: listing.id,
          title: listing.title,
          price: listing.price,
          image: listing.image_url,
          qty: 1,
          max: listing.quantity
        });
      }
      updateCartUI();
      openCart();
    }

    function updateQty(id, delta) {
      const item = cart.find(i => i.id === id);
      if (!item) return;
      const max = item.max || Number.MAX_SAFE_INTEGER;
      item.qty += delta;
      if (item.qty > max) item.qty = max;
      if (item.qty <= 0) {
        removeFromCart(id);
      } else {
        updateCartUI();
      }
    }

    function removeFromCart(id) {
      cart = cart.filter(item => item.id !== id);
      updateCartUI();
    }

    function updateCartUI() {
      localStorage.setItem(CART_KEY, JSON.stringify(cart));
      const totalCount = cart.reduce((sum, item) => sum + item.qty, 0);
      cartBadge.textContent = totalCount;
      document.getElementById('checkoutBtn').disabled = cart.length === 0;

      const totalPrice = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
      cartTotal.textContent = NTIT.money(totalPrice);

      if(cart.length === 0) {
        cartBody.innerHTML = '<div class="cart-empty-msg"><i class="fa-solid fa-cart-flatbed" style="font-size: 1.5rem; margin-bottom: 0.5rem; opacity:0.5;"></i><br>Din varukorg är tom.</div>';
        return;
      }

      cartBody.innerHTML = '';
      cart.forEach(item => {
        const itemEl = document.createElement('div');
        itemEl.className = 'cart-item';
        itemEl.innerHTML = `
          <img src="${NTIT.escapeHTML(item.image || 'images/product-placeholder.svg')}" alt="${NTIT.escapeHTML(item.title)}" class="cart-item-img">
          <div class="cart-item-details">
            <div class="cart-item-title">${NTIT.escapeHTML(item.title)}</div>
            <div class="cart-item-price">${NTIT.money(item.price * item.qty)}</div>
            <div class="cart-qty-controls">
              <button class="qty-btn" onclick="updateQty('${item.id}', -1)" title="Minska antal">-</button>
              <span class="qty-val">${item.qty}</span>
              <button class="qty-btn" onclick="updateQty('${item.id}', 1)" title="Öka antal">+</button>
            </div>
          </div>
          <button class="cart-item-remove" onclick="removeFromCart('${item.id}')" title="Ta bort">
            <i class="fa-solid fa-trash-can"></i>
          </button>
        `;
        cartBody.appendChild(itemEl);
      });
    }

    function openCart() { cartOverlay.classList.add('active'); }
    function closeCart() { cartOverlay.classList.remove('active'); }
    function goToCheckout() {
      if (!requireSession()) return;
      if (cart.length) window.location.href = 'checkout.html';
    }

    openCartBtn.addEventListener('click', openCart);
    closeCartBtn.addEventListener('click', closeCart);
    cartOverlay.addEventListener('click', (e) => {
      if(e.target === cartOverlay) closeCart();
    });

    // HJÄLPFUNKTIONER
    function toggleFav(btn) {
      btn.classList.toggle('active');
      const icon = btn.querySelector('i');
      if(btn.classList.contains('active')) {
        icon.className = 'fa-solid fa-heart';
      } else {
        icon.className = 'fa-regular fa-heart';
      }
    }

    function buyDirect(id) {
      if (!requireSession() || !NTIT.UUID.test(id)) return;
      location.href = `checkout.html?produkt=${encodeURIComponent(id)}`;
    }

    // HÄMTA ANNONSER FRÅN API:ET (senaste först)
    async function loadListings() {
      try {
        const data = await NTIT.api('/listings');
        listings = Array.isArray(data.listings) ? data.listings : [];
      } catch (error) {
        listings = [];
        return false;
      }
      return true;
    }

    countyOptions.innerHTML = counties.map(({ code, name }) =>
      `<label><input type="checkbox" name="county" value="${code}"> ${NTIT.escapeHTML(name)}</label>`
    ).join('');

    function searchCounties() {
      const search = normalizePlace(countySearch.value);
      let visible = 0;
      for (const label of countyOptions.children) {
        label.hidden = !normalizePlace(label.textContent).includes(search);
        if (!label.hidden) visible += 1;
      }
      countyCount.textContent = visible === 0 ? 'Inga län matchar sökningen' : `${visible} län`;
    }

    function filterListings(items, search, filters) {
      const categories = filters.getAll('category');
      const prices = filters.getAll('price');
      const conditions = filters.getAll('condition');
      const selectedCounties = filters.getAll('county');
      const sort = filters.get('sort');
      const matches = (values, value) => values.length === 0 || values.includes(value);
      const filtered = items.filter(listing => {
        const price = Number(listing.price);
        const priceGroup = price < 2000 ? 'low' : price <= 10000 ? 'mid' : 'high';
        const score = Number(listing.condition_score);
        const condition = score >= 7 ? 'good' : score >= 4 ? 'used' : score >= 1 ? 'worn' : 'unknown';

        return (normalizePlace(listing.title).includes(search) || normalizePlace(listing.description).includes(search))
          && matches(categories, listing.category)
          && matches(prices, priceGroup)
          && matches(conditions, condition)
          && matches(selectedCounties, countyForListing(listing));
      });

      if (sort === 'price-asc') filtered.sort((a, b) => a.price - b.price);
      if (sort === 'price-desc') filtered.sort((a, b) => b.price - a.price);
      // The API already returns newest first. Price ties preserve that order.
      return filtered;
    }

    function applyFilters() {
      const search = normalizePlace(searchInput.value);
      const hasFilters = [...activeFilters.keys()].some(key => key !== 'sort');
      latestSectionWrapper.hidden = Boolean(search || hasFilters || activeFilters.get('sort') !== 'newest');
      renderProducts(filterListings(listings, search, activeFilters));
    }

    function setFilterPanel(open) {
      if (!open && filterPanel.contains(document.activeElement)) filterToggle.focus();
      filterPanel.hidden = !open;
      filterToggle.setAttribute('aria-expanded', String(open));
    }

    function applySelectedFilters() {
      activeFilters = new FormData(listingSearch);
      const selected = activeFilters.getAll('category').length;
      document.getElementById('filterToggleLabel').textContent =
        selected === 0 ? 'Alla kategorier' : selected === 1 ? '1 kategori' : `${selected} kategorier`;
      applyFilters();
    }

    filterToggle.addEventListener('click', () => setFilterPanel(filterPanel.hidden));
    countySearch.addEventListener('input', searchCounties);
    searchInput.addEventListener('input', applyFilters);
    listingSearch.addEventListener('keydown', event => {
      if (event.key === 'Escape' && !filterPanel.hidden) {
        event.preventDefault();
        setFilterPanel(false);
      }
      if (event.key === 'Enter' && event.target === countySearch) event.preventDefault();
    });
    listingSearch.addEventListener('submit', event => {
      event.preventDefault();
      applySelectedFilters();
      setFilterPanel(false);
    });
    document.getElementById('resetFilters').addEventListener('click', () => {
      const search = searchInput.value;
      listingSearch.reset();
      searchInput.value = search;
      searchCounties();
      applySelectedFilters();
    });
    searchCounties();

    // INITIALISERING
    (async () => {
      const ok = await loadListings();
      if (ok) {
        renderLatest();
        applyFilters();
      } else {
        feedContainer.innerHTML = '<p style="grid-column: 1/-1; text-align: center; color: var(--text-muted); padding: 3rem;">Det gick inte att hämta annonserna. Kontrollera att servern körs och ladda om sidan.</p>';
      }
      updateCartUI();
    })();
  </script>
</body>
</html>
